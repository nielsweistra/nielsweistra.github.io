# Site settings
title: "Niels Weistra - DevOps Engineer & Cloud Architect"
email: "n.weistra@itlusions.com"
description: "Expert DevOps Engineer and Cloud Architect specializing in Kubernetes, Azure, GitOps, and cloud-native solutions. Founder of ITlusions."
baseurl: ""
url: "https://nielsweistra.github.io"

# Author
author:
  name: "Niels Weistra"
  email: "n.weistra@itlusions.com"
  linkedin: "https://linkedin.com/in/nielswei"
  github: "https://github.com/itlusions"
  company: "https://itlusions.com"

# Build settings
markdown: kramdown
highlighter: rouge
paginate: 6
paginate_path: "/blog/page:num/"
theme: minima

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# SEO Settings
seo:
  type: Person
  name: "Niels Weistra"
  links:
    - "https://linkedin.com/in/nielswei"
    - "https://github.com/itlusions"
    - "https://itlusions.com"
    - "https://nielsweistra.github.io"

# Social Media
social:
  name: "Niels Weistra"
  links:
    - "https://linkedin.com/in/nielswei"
    - "https://github.com/itlusions"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed

# Plugin settings (jekyll-sitemap disabled in favor of custom sitemap.xml)
# sitemap:
#   file: "/sitemap.xml"

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - _site/
  - .git/
  - .gitignore
  - .dockerignore
  - docker-compose.yml
  - Dockerfile
  - start-dev.bat
  - start-dev.sh
  - DEVELOPMENT.md

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Niels Weistra"
  - scope:
      path: ""
    values:
      layout: "default"